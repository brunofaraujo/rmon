# Inventario de servidores Windows monitorados pelo RMonitor.
# Copie para servers.yaml e ajuste. Credenciais WinRM ficam no .env, NAO aqui.

poll_interval_seconds: 60

winrm:
  scheme: https            # https (5986, recomendado) ou http (5985)
  port: 5986
  transport: ntlm          # ntlm | kerberos | credssp
  server_cert_validation: ignore   # ignore (self-signed) | validate
  read_timeout_sec: 30
  operation_timeout_sec: 25

# Padroes aplicados a todos os servidores (podem ser sobrescritos por servidor)
defaults:
  # Lista fixa: se o servico nao existir mais no host, vira alerta (ausente).
  services:
    - "MSSQLSERVER"        # SQL Server (instancia default)
    - "W3SVC"              # IIS
  # Descoberta automatica (curinga, casa nome OU nome de exibicao do servico):
  # o monitor pergunta ao proprio host quantos RM.Host existem a cada coleta.
  # Instancia desinstalada some da lista sozinha (nao vira falha); instalada e
  # parada com inicio automatico continua sendo alerta; deixada em
  # Manual/Disabled aparece em ambar (parada de proposito).
  service_patterns:
    - "RM.Host*"
  eventlog:
    logs: [System, Application]
    level: 2               # 1=Critical, 2=Error, 3=Warning
    max_events: 10
  # Inventario do software TOTVS (pagina /pacotes). Cadencia propria, em horas:
  # o que esta instalado muda em dias, nao a cada ciclo de metricas.
  inventory:
    enabled: true
    interval_hours: 6
    # So TOTVS: o parque RM nao precisa dar noticia de navegador nem de antivirus.
    only_totvs: true
    totvs_regex: "TOTVS|RM Sistemas|Microsiga|Corpore"
    # Arquivos da pasta de instalacao rastreados um a um. A pasta e descoberta
    # pelo caminho dos servicos casados por service_patterns (RM.Host*).
    watch: ["RM.Cst.*", "RM.Lib.*", "*Customizacao*", "*Customizada*", "RM*.exe"]
    # Subpastas varridas por inteiro: e onde ficam as customizacoes do cliente
    custom_folders: ["Custom", "Scripts Especificos"]
    custom_prefix: "RM.*"     # nelas, so os arquivos da TOTVS/RM
    # paths: ["D:\\totvs\\CorporeRM\\RM.Net"]   # pastas extras, se houver
    hotfixes: false           # KBs do Windows: e SO, nao TOTVS
    ignore:                   # ruido do registro, aplicado antes do filtro TOTVS
      - "Update for Microsoft*"
      - "Security Update for*"

  # Execucao de instalacoes (pagina /pacotes/tarefas). DESARMADA por padrao:
  # com enabled: false o RMon so faz o PRE-VOO - checagens somente-leitura no
  # host e o comando exato que seria executado. Nada e instalado.
  execution:
    enabled: false           # trava mestra. true = pode instalar de verdade
    hosts: []                # lista explicita de hosts liberados. Vazia = nenhum
    window: "20:00-06:00"    # janela de manutencao (vazio = qualquer hora)
    max_sessions: 0          # recusa se houver mais sessoes RDP que isto
    min_free_gb: 2           # espaco livre minimo no disco de destino
    require_services_stopped: []   # ex.: ["RM.Host*"] - exige parados antes
    temp_dir: "C:\\totvs\\rmon-stage"   # onde o pacote fica antes de instalar
    # Endereco do RMon COMO O HOST O ENXERGA: e por aqui que o pacote viaja da
    # VM para o servidor Windows (exige a porta liberada no firewall da VM).
    base_url: ""             # ex.: "http://10.10.10.110:8080"
    # Catalogo de acoes permitidas. Nao existe comando livre: o executavel e
    # sempre o pacote que o RMon colocou no host, e os argumentos sao estes.
    actions: []
    #   - id: copiar-custom
    #     label: "Copiar DLL para a pasta Custom da instalacao"
    #     dest: "Custom"            # subpasta simples dentro da instalacao do RM
    #     extensions: [".dll"]
    #   - id: instalador-silencioso
    #     label: "Instalador TOTVS em modo silencioso"
    #     args: "/S"                # texto fixo; ; & | < > ` $ sao recusados
    #     extensions: [".exe"]
    #     timeout_sec: 1800

servers:
  - name: rm-app-01
    host: 10.10.10.50
    # services: [...]          # opcional: sobrescreve defaults.services
    # service_patterns: [...]  # opcional: sobrescreve defaults.service_patterns
    app_health:
      url: "http://10.10.10.50:8051/"   # endpoint HTTP do RM para checar
      expect_status: 200
      timeout_sec: 8

  - name: rm-db-01
    host: 10.10.10.51
    services:
      - "MSSQLSERVER"
      - "SQLSERVERAGENT"
    # sem app_health (servidor de banco)
