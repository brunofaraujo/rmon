# nginx na frente do RMonitor: termina o TLS na 443 e repassa ao uvicorn (8080).
# Instalado por deploy/definir-https.sh em /etc/nginx/sites-available/rmon.
# A 8080 segue aberta em HTTP para os hosts Windows baixarem pacotes.

# 80: so entrega a CA (para instalar antes de confiar no HTTPS) e manda o resto para a 443.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /rmon-ca.crt {
        alias /etc/rmon/tls/rmon-ca.crt;
        default_type application/x-x509-ca-cert;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/rmon/tls/rmon.crt;
    ssl_certificate_key /etc/rmon/tls/rmon.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:rmon:10m;
    ssl_session_timeout 1d;
    # Sem Strict-Transport-Security de proposito: com CA propria, o HSTS impediria
    # contornar o aviso em quem ainda nao instalou a CA.

    client_max_body_size 20m;

    location = /rmon-ca.crt {
        alias /etc/rmon/tls/rmon-ca.crt;
        default_type application/x-x509-ca-cert;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # uvicorn confia nestes cabecalhos vindos de 127.0.0.1 (--forwarded-allow-ips
        # padrao): o IP da auditoria continua sendo o do cliente, nao o do nginx.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # acoes via WinRM (restart, logoff) podem levar minutos em host engasgado
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
